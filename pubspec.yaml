name: akar
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  bloc: ^9.2.2
  cached_network_image: ^4.0.7
  camera: ^0.12.2
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_bloc: ^9.1.2
  flutter_hooks: ^0.21.4
  flutter_local_notifications: ^23.0.4
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.1
  geolocator: ^14.1.2
  get_it: ^9.3.0
  go_router: ^18.1.4
  google_maps_flutter: ^2.19.0
  image: ^4.13.1
  image_compress_plus: ^4.0.0
  image_cropper: ^14.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.8.0
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^7.2.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  v_video_compressor: ^3.0.1
  video_player: ^2.14.1

dev_dependencies:
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/permissions/
    - assets/sounds/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
