name: akar
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  dartz: ^0.10.1
  dio: ^5.10.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.2.0
  freezed_annotation: ^3.1.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  get_it: ^9.2.1
  go_router: ^17.3.0
  google_maps_flutter: ^2.18.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logger: ^2.7.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.webp"
  min_sdk_android: 21
  remove_alpha_ios: true
